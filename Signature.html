<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#414936">
<title>Signature Collection | NICHA SPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#414936;--green2:#687054;--gold:#c6ad7a;--cream:#f5ebdd;--paper:#fffaf2;--ink:#35372e;--muted:#817d72}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f1e7,#fffaf2 48%,#eee3d1);color:var(--ink);font-family:Kanit,sans-serif}
header{padding:18px 5%;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px}header strong{letter-spacing:2px;font-weight:500}header a{color:#f3dfb6;text-decoration:none;font-size:13px}
.hero{max-width:1100px;margin:0 auto;padding:54px 22px 30px;text-align:center}.eyebrow{font-size:12px;letter-spacing:4px;color:#98794c}.hero h1{font:500 clamp(34px,6vw,60px)/1.1 'Playfair Display',serif;color:var(--green);margin:13px 0}.hero p{color:#777366;margin:10px auto;max-width:620px;line-height:1.9}
.ornament{color:var(--gold);font-size:24px;margin:12px}
.card{max-width:1000px;margin:0 auto 70px;background:var(--paper);border:1px solid #d9c7a3;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px #3d40251c;display:grid;grid-template-columns:1fr 1fr}
.photo{min-height:440px;background:linear-gradient(135deg,#d8c9aa,#8d9276);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.photo .fallback{font:500 34px 'Playfair Display',serif;color:#fff9e9;letter-spacing:4px;text-shadow:0 2px 12px #3338}
.details{padding:clamp(25px,5vw,54px);display:flex;flex-direction:column;justify-content:center}.tag{color:#9b7b4b;font-size:11px;letter-spacing:3px}.details h2{font:500 clamp(28px,4vw,40px)/1.25 'Playfair Display',serif;color:var(--green);margin:12px 0}.details .desc{line-height:1.9;color:#777366;font-size:14px}.meta{display:flex;gap:20px;margin:22px 0;padding:16px 0;border-top:1px solid #e8decc;border-bottom:1px solid #e8decc}.meta div{flex:1}.meta small{display:block;color:#8c8678;font-size:11px}.meta strong{font-size:20px;color:var(--green);font-weight:500}.price{font-size:30px!important;color:#987448!important}.book{display:inline-block;text-align:center;text-decoration:none;background:var(--green);color:#fff;padding:14px 22px;border-radius:8px;letter-spacing:.5px;margin-top:6px;transition:.2s}.book:hover{background:#59634b}.status{text-align:center;color:#817d72;padding:35px 15px}.footer{text-align:center;padding:0 20px 35px;color:#8a8477;font-size:12px;letter-spacing:1px}
@media(max-width:760px){.card{grid-template-columns:1fr;margin:0 14px 45px}.photo{min-height:280px}.hero{padding-top:38px}.details{padding:28px 24px}}
</style></head>
<body>
<header><strong>NICHA WELLNESS &amp; SPA</strong><a href="https://jifenii11-cell.github.io/nicha-massage/">กลับหน้าแรก ↗</a></header>
<section class="hero"><div class="eyebrow">EXCLUSIVE EXPERIENCE</div><h1>Signature Collection</h1><div class="ornament">✦</div><p>สัมผัสประสบการณ์การดูแลและผ่อนคลายที่คัดสรรโดย NICHA SPA<br>หนึ่งคอร์สพิเศษที่ร้านเลือกมาเพื่อคุณ</p></section>
<main id="content"><div class="status">กำลังโหลดคอร์ส Signature...</div></main>
<div class="footer">NICHA WELLNESS &amp; SPA · YOUR MOMENT OF SERENITY</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyIh2N7BoxWlug6E7-h2METVTZbTN2B7PMmTcj70SuV1Mxoq_AHZK5QKl0rR49FJS3NGg/exec';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('th-TH');}
function loadSignature(){const callback='nichaSignatureCallback';window[callback]=function(result){delete window[callback];if(!result||!result.success||!result.service){document.getElementById('content').innerHTML='<div class="status">ขณะนี้ยังไม่มีคอร์ส Signature ที่ร้านเลือกไว้<br>กรุณากลับมาเยี่ยมชมอีกครั้ง</div>';return;}const s=result.service;const booking='https://script.google.com/macros/s/AKfycbyIh2N7BoxWlug6E7-h2METVTZbTN2B7PMmTcj70SuV1Mxoq_AHZK5QKl0rR49FJS3NGg/exec?page=booking&service='+encodeURIComponent(s.name);document.getElementById('content').innerHTML=`<article class="card"><div class="photo"><div class="fallback">NICHA SIGNATURE</div></div><div class="details"><div class="tag">THE NICHA SIGNATURE</div><h2>${esc(s.name)}</h2><p class="desc">คอร์สพิเศษจากรายการบริการของ NICHA SPA ที่คัดเลือกไว้เพื่อมอบช่วงเวลาแห่งการพักผ่อนอย่างสมบูรณ์แบบ</p><div class="meta"><div><small>DURATION</small><strong>${money(s.duration)} นาที</strong></div><div><small>SPECIAL SERVICE</small><strong class="price">฿${money(s.price)}</strong></div></div><a class="book" href="${booking}">จองคอร์สนี้</a></div></article>`;};const script=document.createElement('script');script.src=API_URL+'?api=signatureData&callback='+callback+'&_='+Date.now();script.onerror=()=>{document.getElementById('content').innerHTML='<div class="status">เชื่อมต่อข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>';};document.body.appendChild(script);}
document.addEventListener('DOMContentLoaded',loadSignature);
</script></body></html>
