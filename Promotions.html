<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#414936">
  <title>โปรโมชั่น | NICHA SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#414936;--green2:#687054;--cream:#f7f3eb;--paper:#fffdf8;--gold:#b18a59;--ink:#39372f;--muted:#817d72}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Kanit',sans-serif}
    header{background:var(--green);color:#fff;padding:22px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .brand{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:2px}.brand small{display:block;font:300 11px 'Kanit';letter-spacing:3px;color:#d9d1c0}
    nav a{color:#fff;text-decoration:none;margin-left:22px;font-size:14px}
    .hero{text-align:center;padding:65px 20px 48px;background:linear-gradient(135deg,#e9e5d8,#f7f3eb)}
    .eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px}.hero h1{font:600 42px 'Playfair Display',serif;color:var(--green);margin:10px 0}
    .hero p{color:var(--muted);margin:0}
    main{max-width:1160px;margin:0 auto;padding:45px 22px 75px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:25px}
    .card{background:var(--paper);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px #35352612;border:1px solid #e9e3d7}
    .photo{height:225px;background:#e7e3d8;display:flex;align-items:center;justify-content:center;color:#969184;overflow:hidden}
    .photo img{display:block;width:100%;height:100%;object-fit:cover}
    .photo.no-image{font-size:14px;letter-spacing:.5px}
    .body{padding:22px}.tag{display:inline-block;background:#e9eddf;color:var(--green);border-radius:30px;padding:4px 12px;font-size:12px;margin-bottom:10px}
    h2{font-size:21px;font-weight:500;margin:0 0 9px;color:var(--green)}
    .desc{font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-line;min-height:50px}
    .prices{display:flex;align-items:baseline;gap:12px;margin:17px 0}.old{color:#999;text-decoration:line-through;font-size:14px}.new{font-size:25px;color:#9b7447;font-weight:600}
    .dates{font-size:12px;color:#8b887e;margin-bottom:17px}
    .book{display:block;text-align:center;text-decoration:none;background:var(--green);color:#fff;padding:11px;border-radius:8px}
    .empty,.loading{text-align:center;padding:55px 15px;color:var(--muted);grid-column:1/-1}
    footer{text-align:center;background:var(--green);color:#ddd8ca;padding:25px;font-size:13px}
    @media(max-width:600px){header{padding:17px 20px}nav a{margin-left:10px;font-size:12px}.hero h1{font-size:34px}.hero{padding:48px 15px 38px}}
  </style>
</head>
<body>
<header>
  <div class="brand">NICHA SPA<small>WELLNESS & RELAXATION</small></div>
  <nav><a href="<?= webAppUrl ?>">หน้าหลัก</a><a href="<?= webAppUrl ?>?page=services">บริการ</a><a href="<?= webAppUrl ?>?page=booking">จองคิว</a></nav>
</header>
<section class="hero">
  <div class="eyebrow">SPECIAL OFFERS</div>
  <h1>โปรโมชั่นพิเศษ</h1>
  <p>มอบช่วงเวลาแห่งการผ่อนคลายในราคาพิเศษสำหรับคุณ</p>
</section>
<main><div id="promotionGrid" class="grid"><div class="loading">กำลังโหลดโปรโมชั่น...</div></div></main>
<footer>NICHA SPA · นวดเพื่อสุขภาพ ผ่อนคลายอย่างเหนือระดับ</footer>
<script>
const WEB_APP_URL = <?= JSON.stringify(webAppUrl) ?>;
const grid = document.getElementById('promotionGrid');

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function money(v){
  return v === '' || v == null ? '' : Number(v).toLocaleString('th-TH') + ' บาท';
}

// สร้าง URL รูปจาก imageUrl หรือ imageId ที่ได้จาก Google Sheet
function promotionImageUrl(p){
  if (p.imageUrl) return String(p.imageUrl);
  if (p.imageId) {
    return 'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(String(p.imageId)) + '&sz=w1200';
  }
  return '';
}

// หาก thumbnail โหลดไม่ได้ ให้ลอง URL แสดงรูปอีกแบบของ Google Drive
function handlePromotionImageError(img){
  const fileId = img.dataset.fileId || '';
  if (fileId && !img.dataset.triedDirect) {
    img.dataset.triedDirect = '1';
    img.src = 'https://drive.google.com/uc?export=view&id=' +
      encodeURIComponent(fileId);
    return;
  }

  const holder = img.parentElement;
  if (holder) {
    holder.classList.add('no-image');
    holder.textContent = 'ภาพโปรโมชั่น NICHA SPA';
  }
}

function render(items){
  if (!items || !items.length) {
    grid.innerHTML = '<div class="empty">ขณะนี้ยังไม่มีโปรโมชั่น<br>กรุณาติดตามข่าวสารจาก NICHA SPA</div>';
    return;
  }

  grid.innerHTML = items.map(p => {
    const imageUrl = promotionImageUrl(p);
    const imageBlock = imageUrl
      ? `<div class="photo"><img src="${esc(imageUrl)}" data-file-id="${esc(p.imageId || '')}" alt="${esc(p.title || 'ภาพโปรโมชั่น NICHA SPA')}" loading="lazy" referrerpolicy="no-referrer" onerror="handlePromotionImageError(this)"></div>`
      : '<div class="photo no-image">ภาพโปรโมชั่น NICHA SPA</div>';

    return `
      <article class="card">
        ${imageBlock}
        <div class="body">
          <span class="tag">SPECIAL OFFER</span>
          <h2>${esc(p.title)}</h2>
          <div class="desc">${esc(p.description || '')}</div>
          <div class="prices">
            ${p.originalPrice !== '' && p.originalPrice != null ? `<span class="old">${money(p.originalPrice)}</span>` : ''}
            <span class="new">${p.promoPrice !== '' && p.promoPrice != null ? money(p.promoPrice) : 'สอบถามราคา'}</span>
          </div>
          <div class="dates">${p.startDate || p.endDate ? 'ระยะเวลา: ' + esc(p.startDate || 'ไม่ระบุ') + ' ถึง ' + esc(p.endDate || 'ไม่ระบุ') : 'โปรโมชั่นพิเศษ'}</div>
          <a class="book" href="${esc(WEB_APP_URL)}?page=booking&service=${encodeURIComponent(p.title || '')}">จองบริการนี้</a>
        </div>
      </article>`;
  }).join('');
}

google.script.run
  .withSuccessHandler(render)
  .withFailureHandler(e => {
    grid.innerHTML = '<div class="empty">ไม่สามารถโหลดโปรโมชั่นได้ในขณะนี้<br>' +
      esc(e && e.message || 'กรุณาลองใหม่') + '</div>';
  })
  .getNichaPromotions();
</script>
</body>
</html>
