<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#414936">
  <title>โปรโมชั่น | NICHA SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#414936;--green2:#687054;--cream:#f7f3eb;--paper:#fffdf8;--gold:#b18a59;--ink:#39372f;--muted:#817d72}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:'Kanit',sans-serif}
    header{background:var(--green);color:#fff;padding:22px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .brand{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:2px}
    .brand small{display:block;font:300 11px 'Kanit';letter-spacing:3px;color:#d9d1c0}
    nav a{color:#fff;text-decoration:none;margin-left:22px;font-size:14px}
    .hero{text-align:center;padding:65px 20px 48px;background:linear-gradient(135deg,#e9e5d8,#f7f3eb)}
    .eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px}
    .hero h1{font:600 42px 'Playfair Display',serif;color:var(--green);margin:10px 0}
    .hero p{color:var(--muted);margin:0}
    main{max-width:1160px;margin:0 auto;padding:45px 22px 75px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:25px}
    .card{background:var(--paper);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px #35352612;border:1px solid #e9e3d7}
    .photo{height:225px;background:#e7e3d8;display:flex;align-items:center;justify-content:center;color:#969184;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-placeholder{padding:20px;text-align:center}
    .body{padding:22px}
    .tag{display:inline-block;background:#e9eddf;color:var(--green);border-radius:30px;padding:4px 12px;font-size:12px;margin-bottom:10px}
    h2{font-size:21px;font-weight:500;margin:0 0 9px;color:var(--green)}
    .desc{font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-line;min-height:50px}
    .prices{display:flex;align-items:baseline;gap:12px;margin:17px 0}
    .old{color:#999;text-decoration:line-through;font-size:14px}
    .new{font-size:25px;color:#9b7447;font-weight:600}
    .dates{font-size:12px;color:#8b887e;margin-bottom:17px}
    .book{display:block;text-align:center;text-decoration:none;background:var(--green);color:#fff;padding:11px;border-radius:8px;transition:.2s}
    .book:hover{background:var(--green2)}
    .empty,.loading{text-align:center;padding:55px 15px;color:var(--muted);grid-column:1/-1}
    footer{text-align:center;background:var(--green);color:#ddd8ca;padding:25px;font-size:13px}
    @media(max-width:600px){
      header{padding:17px 20px;flex-wrap:wrap}
      nav a{margin-left:10px;font-size:12px}
      .hero h1{font-size:34px}
      .hero{padding:48px 15px 38px}
    }
  </style>
</head>
<body>
<header>
  <div class="brand">NICHA SPA<small>WELLNESS &amp; RELAXATION</small></div>
  <nav>
    <a href="https://jifenii11-cell.github.io/nicha-massage/">หน้าหลัก</a>
    <a href="https://script.google.com/macros/s/AKfycbyIh2N7BoxWlug6E7-h2METVTZbTN2B7PMmTcj70SuV1Mxoq_AHZK5QKl0rR49FJS3NGg/exec?page=services">
  บริการ
</a>
    <a href="https://script.google.com/macros/s/AKfycbyIh2N7BoxWlug6E7-h2METVTZbTN2B7PMmTcj70SuV1Mxoq_AHZK5QKl0rR49FJS3NGg/exec?page=booking">จองคิว</a>
  </nav>
</header>

<section class="hero">
  <div class="eyebrow">SPECIAL OFFERS</div>
  <h1>โปรโมชั่นพิเศษ</h1>
  <p>มอบช่วงเวลาแห่งการผ่อนคลายในราคาพิเศษสำหรับคุณ</p>
</section>

<main>
  <div id="promotionGrid" class="grid">
    <div class="loading">กำลังโหลดโปรโมชั่น...</div>
  </div>
</main>
<footer>NICHA SPA · นวดเพื่อสุขภาพ ผ่อนคลายอย่างเหนือระดับ</footer>

<script>
/*
 * หน้า Promotions นี้ทำงานบน GitHub Pages
 * จึงเรียก Apps Script ด้วย JSONP แทน google.script.run
 */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyIh2N7BoxWlug6E7-h2METVTZbTN2B7PMmTcj70SuV1Mxoq_AHZK5QKl0rR49FJS3NGg/exec';
const grid = document.getElementById('promotionGrid');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function money(value) {
  return value === '' || value == null ? '' : Number(value).toLocaleString('th-TH') + ' บาท';
}

function getImageUrl(promotion) {
  if (promotion.imageUrl) return String(promotion.imageUrl);
  if (promotion.imageId) {
    return 'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(promotion.imageId) + '&sz=w1200';
  }
  return '';
}

function handlePromotionImageError(img) {
  const fileId = img.getAttribute('data-file-id') || '';
  const tried = img.getAttribute('data-tried') || '';

  if (fileId && tried !== 'direct') {
    img.setAttribute('data-tried', 'direct');
    img.src = 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(fileId);
    return;
  }

  const box = img.parentElement;
  if (box) box.innerHTML = '<div class="photo-placeholder">ภาพโปรโมชั่น NICHA SPA</div>';
}

function render(items) {
  if (!Array.isArray(items) || !items.length) {
    grid.innerHTML = '<div class="empty">ขณะนี้ยังไม่มีโปรโมชั่น<br>กรุณาติดตามข่าวสารจาก NICHA SPA</div>';
    return;
  }

  grid.innerHTML = items.map(function(p) {
    const imageUrl = getImageUrl(p);
    const image = imageUrl
      ? '<img src="' + esc(imageUrl) + '" alt="' + esc(p.title || 'โปรโมชั่น NICHA SPA') +
        '" loading="lazy" referrerpolicy="no-referrer" data-file-id="' +
        esc(p.imageId || '') + '" onerror="handlePromotionImageError(this)">'
      : '<div class="photo-placeholder">ภาพโปรโมชั่น NICHA SPA</div>';

    const serviceName = p.title || '';
    const bookingUrl = WEB_APP_URL + '?page=booking&service=' + encodeURIComponent(serviceName);

    return '<article class="card">' +
      '<div class="photo">' + image + '</div>' +
      '<div class="body">' +
        '<span class="tag">SPECIAL OFFER</span>' +
        '<h2>' + esc(p.title || 'โปรโมชั่นพิเศษ') + '</h2>' +
        '<div class="desc">' + esc(p.description || '') + '</div>' +
        '<div class="prices">' +
          (p.originalPrice !== '' && p.originalPrice != null
            ? '<span class="old">' + money(p.originalPrice) + '</span>' : '') +
          '<span class="new">' + (p.promoPrice !== '' && p.promoPrice != null
            ? money(p.promoPrice) : 'สอบถามราคา') + '</span>' +
        '</div>' +
        '<div class="dates">' +
          (p.startDate || p.endDate
            ? 'ระยะเวลา: ' + esc(p.startDate || 'ไม่ระบุ') + ' ถึง ' + esc(p.endDate || 'ไม่ระบุ')
            : 'โปรโมชั่นพิเศษ') +
        '</div>' +
        '<a class="book" href="' + esc(bookingUrl) + '">จองบริการนี้</a>' +
      '</div>' +
    '</article>';
  }).join('');
}

function showLoadError(message) {
  grid.innerHTML = '<div class="empty">ไม่สามารถโหลดโปรโมชั่นได้ในขณะนี้<br>' +
    esc(message || 'กรุณาลองใหม่อีกครั้ง') + '</div>';
}

function loadPromotions() {
  const callbackName = 'nichaPromotionCallback_' + Date.now();
  const script = document.createElement('script');
  const timeout = window.setTimeout(function() {
    cleanup();
    showLoadError('หมดเวลารอข้อมูล กรุณารีเฟรชหน้าเว็บ');
  }, 20000);

  function cleanup() {
    window.clearTimeout(timeout);
    if (script.parentNode) script.parentNode.removeChild(script);
    try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
  }

  window[callbackName] = function(response) {
    cleanup();
    if (response && response.success && Array.isArray(response.promotions)) {
      render(response.promotions);
    } else {
      showLoadError(response && response.message);
    }
  };

  script.onerror = function() {
    cleanup();
    showLoadError('เชื่อมต่อฐานข้อมูลโปรโมชั่นไม่สำเร็จ');
  };

  script.src = WEB_APP_URL + '?action=getPromotions&callback=' + callbackName +
    '&_=' + Date.now();
  document.body.appendChild(script);
}

loadPromotions();
</script>
</body>
</html>
